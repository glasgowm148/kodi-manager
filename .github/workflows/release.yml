name: Release
on:
  push:
    tags: ['v*']
# Read-only by default. The build job runs the project's code with a read-only token; only the
# publish job may write, and it runs no project code: it downloads the built files, checks them
# against SHA256SUMS and creates the release.
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Same as ci.yml's kodi-python job: Kodi 19-21 on Android embeds Python 3.8, which runs the
  # service code, so a tag must not publish code that only works on 3.9+. (3.8 needs ubuntu-22.04.)
  kodi-python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.8'
      - run: python -m pip install "pytest>=8,<8.4"
      - run: python -m pytest -q
        env:
          PYTHONPATH: src

  build:
    needs: kodi-python
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Project code runs below: keep the token out of .git/config so it cannot be read back.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20
      - name: Tag matches version.py
        id: version
        run: |
          version=$(python -c 'import re,pathlib; print(re.search(r"^VERSION = \"([^\"]+)\"", pathlib.Path("src/kodi_manager/version.py").read_text(), re.M).group(1))')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match src/kodi_manager/version.py (${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: node --test tests/*.js
      - run: python -m build
      - run: python scripts/build_addon.py
      - name: Add-on ZIP is reproducible
        run: |
          python scripts/build_addon.py --output rebuild
          cmp "dist/service.kodi.addonadmin-${{ steps.version.outputs.version }}.zip" \
              "rebuild/service.kodi.addonadmin-${{ steps.version.outputs.version }}.zip"
      - run: python scripts/test_wheel.py
      - name: Inspect archives and write checksums
        run: |
          python scripts/check_release.py --version "${{ steps.version.outputs.version }}" \
            dist/*.whl dist/*.tar.gz "dist/service.kodi.addonadmin-${{ steps.version.outputs.version }}.zip" \
            --write-checksums dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          python - "${{ steps.version.outputs.version }}" > release-notes.md <<'PY'
          import re, sys, pathlib
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(r"^## %s\b.*?$(.*?)(?=^## |\Z)" % re.escape(sys.argv[1]), text, re.M | re.S)
          if not match or not match.group(1).strip():
              sys.exit("CHANGELOG.md has no section for " + sys.argv[1])
          print(match.group(1).strip())
          PY
      - name: Stage the release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          cp dist/*.whl dist/*.tar.gz "dist/service.kodi.addonadmin-${VERSION}.zip" dist/SHA256SUMS release-notes.md release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      # v8 fails on a digest mismatch by default (digest-mismatch: error).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Files match SHA256SUMS, and nothing else is published
        working-directory: release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha256sum --strict -c SHA256SUMS
          listed=$(cut -d' ' -f3 SHA256SUMS | sort)
          present=$(ls | grep -v -x -e SHA256SUMS -e release-notes.md | sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::Release files differ from SHA256SUMS"; exit 1
          fi
          test -f "service.kodi.addonadmin-${VERSION}.zip"
      - name: Create prerelease
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --prerelease --verify-tag \
            --title "Kodi Manager ${VERSION}" --notes-file release-notes.md \
            ./*.whl ./*.tar.gz "service.kodi.addonadmin-${VERSION}.zip" SHA256SUMS
