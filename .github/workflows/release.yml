name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Tag matches version.py
        id: version
        run: |
          version=$(python -c 'import re,pathlib; print(re.search(r"^VERSION = \"([^\"]+)\"", pathlib.Path("src/kodi_manager/version.py").read_text(), re.M).group(1))')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match src/kodi_manager/version.py (${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: node --test tests/*.js
      - run: python -m build
      - run: python scripts/build_addon.py
      - name: Add-on ZIP is reproducible
        run: |
          python scripts/build_addon.py --output rebuild
          cmp "dist/service.kodi.addonadmin-${{ steps.version.outputs.version }}.zip" \
              "rebuild/service.kodi.addonadmin-${{ steps.version.outputs.version }}.zip"
      - run: python scripts/test_wheel.py
      - name: Inspect archives and write checksums
        run: |
          python scripts/check_release.py --version "${{ steps.version.outputs.version }}" \
            dist/*.whl dist/*.tar.gz "dist/service.kodi.addonadmin-${{ steps.version.outputs.version }}.zip" \
            --write-checksums dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          python - "${{ steps.version.outputs.version }}" > release-notes.md <<'PY'
          import re, sys, pathlib
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(r"^## %s\b.*?$(.*?)(?=^## |\Z)" % re.escape(sys.argv[1]), text, re.M | re.S)
          if not match or not match.group(1).strip():
              sys.exit("CHANGELOG.md has no section for " + sys.argv[1])
          print(match.group(1).strip())
          PY
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "${GITHUB_REF_NAME}" --prerelease --verify-tag \
            --title "Kodi Manager ${version}" --notes-file release-notes.md \
            dist/*.whl dist/*.tar.gz "dist/service.kodi.addonadmin-${version}.zip" dist/SHA256SUMS
