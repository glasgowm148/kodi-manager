name: Dependency and secret checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install . pip-audit==2.10.1
      - run: pip-audit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - run: $(go env GOPATH)/bin/gitleaks git --redact=100 --no-banner --log-opts=--all
