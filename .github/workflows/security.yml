name: Dependency and secret checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install . pip-audit==2.10.1
      - run: pip-audit
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - run: $(go env GOPATH)/bin/gitleaks git --redact=100 --no-banner --log-opts=--all
