name: Dependency and secret checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install . pip-audit==2.10.1
      - run: pip-audit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - run: $(go env GOPATH)/bin/gitleaks git --redact=100 --no-banner --log-opts=--all
