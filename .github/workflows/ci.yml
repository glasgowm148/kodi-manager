name: Test and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Write the Linux screenshot baselines and upload them as an artifact (commit them by hand)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: for f in web/*.js; do node --check "$f"; done
        shell: bash
      - run: node --test tests/*.js
        shell: bash
      - run: python -m build
      # Builds the add-on ZIP; fails if addon.xml and src/kodi_manager/version.py differ.
      - run: python scripts/build_addon.py
      - run: python scripts/test_wheel.py
      # Inspects all three archives and checks each one's version against version.py.
      - run: python scripts/check_release.py dist/*.whl dist/*.tar.gz dist/service.kodi.addonadmin-*.zip
        shell: bash

  # Kodi 19-21 on Android embeds Python 3.8, which runs the service code. The library itself
  # needs 3.9+, so this job runs the test suite against the sources rather than installing them.
  kodi-python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.8'
      - run: python -m pip install "pytest>=8,<8.4"
      - run: python -m pytest -q
        env:
          PYTHONPATH: src

  # Static types of the service and library sources, checked as Python 3.8 (Kodi 19-21 on Android).
  # typings/ holds stubs for Kodi's own modules; settings are under [tool.pyright] in pyproject.toml.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20
      - run: python -m pip install pyright==1.1.414
      - run: pyright

  # The dashboard in Chromium against scripts/demo_server.py (synthetic data); see e2e/README.md.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test $UPDATE_SNAPSHOTS
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.update_snapshots
        with:
          name: linux-screenshots
          path: e2e/tests/__screenshots__/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
