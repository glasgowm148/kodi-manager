name: Test and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: node --test tests/test_settings_ui.js tests/test_app_status.js tests/test_dashboard.js tests/test_widgets_ui.js
      - run: python -m build
      - run: python scripts/build_addon.py
      - run: python scripts/test_wheel.py
      - run: python scripts/check_release.py dist/kodi_manager-0.4.1-py3-none-any.whl dist/kodi_manager-0.4.1.tar.gz dist/service.kodi.addonadmin-0.4.1.zip
