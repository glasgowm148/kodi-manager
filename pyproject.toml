[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kodi-manager"
dynamic = ["version"]
description = "Reusable Kodi management library and optional authenticated dashboard companion"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1.2,<2", "ruff>=0.12,<1"]

[project.urls]
Repository = "https://github.com/glasgowm148/kodi-manager"
Issues = "https://github.com/glasgowm148/kodi-manager/issues"

[tool.hatch.version]
# Single version source, shared with the Kodi add-on (addon.xml is checked against it).
path = "src/kodi_manager/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kodi_manager"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "kodi_manager/web"

[tool.hatch.build.targets.sdist]
include = ["src", "web", "addon", "tests", "scripts", "docs", ".github", ".gitattributes", "pyproject.toml", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE", "SECURITY.md", "AGENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
